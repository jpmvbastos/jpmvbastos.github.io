- title: "<b>[7] The politics of lockdown policies: Evidence from Brazilian states</b>"
  type: "Published"
  abstract: "We introduce a novel state-level measure of lockdown regulatory freedom to study the severity of lockdowns for Brazilian states and its determinants. Our main results show that lockdown policies were not consistently determined by any health-related variable, such as the number of doctors, hospital beds, the share of the population with private health insurance, or the share of the population 65 years of age and older or Covid-19 cases and deaths. Indeed, the only variable consistently related to lockdown policies in all specifications and robustness checks was the state’s share of votes for the right-wing candidate. A one standard deviation increase in the share of votes for the right-wing candidate is associated with a 0.6-0.87 standard deviation increase in lockdown stringency. Our results highlight the importance of political economy considerations in explaining the incentives of policymakers when designing health policies."
  year: 2025
  date: 2025-03-01
  journal: "<em>Economic Affairs</em>"
  pubclosed: "https://onlinelibrary.wiley.com/doi/10.1111/ecaf.12702"
  pdf: "../files/research/bastos-miozzi-2025-politics-lockdown-brazil.pdf"
  github: "https://github.com/jpmvbastos/COVIDBR/"
  with: "with <a href='https://www.vincentmiozzi.com'>Vincent Miozzi</a>"

- title: "<b>[6] The Political Economy of Populism Regime Length</b>"
  type: "Published"
  abstract: "Left-leaning populist regimes in 21st-century Latin America have become notoriously long, including some that maintained their power by repealing term limits. Along with changes in external factors, we argue that repealing term limits allowed populist leaders to develop longer time horizons and behave more like stationary than roving bandits. We show that, relative to those constrained by time limits, unconstrained populist leaders mitigate the economic effects of the populist cycle of boom, stagnation, and bust. Populists constrained by term limits act like roving bandits, engaging in more extractive rent-seeking that leads to more significant economic fluctuations."
  year: 2025
  journal: "<em>Constitutional Political Economy</em>"
  pubopen: "https://link.springer.com/article/10.1007/s10602-025-09465-4"
  pdf: "../files/research/bastos-cachanosky-faintich-2025-populism-regime-length.pdf"
  ssrn: "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=4445116"
  date: 2025-02-02
  with: "with <a href='https://www.ncachanosky.com'>Nicolás Cachanosky</a> and <a href='https://www.linkedin.com/in/tomasfaintich/'>Tomás Faintich</a>"

- title: "<b>[5] The Institutional Impact of Left-Leaning Populism in Latin America</b>"
  type: "Published"
  abstract: "We study the institutional impact 21st-century left-leaning populist regimes have in Latin America. Looking at the iconic left-leaning populist regimes in Argentina, Bolivia, Ecuador, Nicaragua, and Venezuela, we find that these types of populist regimes impose a significant deterioration on the liberal-democracy institutional quality of their countries. The institutional cost is both significant and long-lasting, and our synthetic counterfactual suggests that liberal democratic institutions would have improved if not for these populist regimes."
  date: 2025-01-01
  year: 2025
  with: "with <a href='https://www.ncachanosky.com'>Nicolás Cachanosky</a>, <a href='https://www.alexandrepadilla.com'>Alexandre Padilla</a>, and <a href='https://www.linkedin.com/in/karlahernandez321/'>Karla C. Hernández</a>"
