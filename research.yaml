- title: "<b>[4] Gender and Corruption in Firms: The Importance of Regional Context</b>"
  type: "Published"
  abstract: "The idea that there are gendered differences in corruption in the political arena is common. Two explanations for these differences include risk aversion and network effects. However, business leaders include a self-selected group of individuals that are comparatively risk tolerant and well-connected. Using firm-level data for 144 countries from 2006 to 2019, we test whether female-run businesses engage in corruption differently than men. In the aggregate, we find a potentially puzzling result: female-managed firms are engaged in less corruption and report it being less of an obstacle compared to their male-counterparts; female-owned firms are just the opposite. Once we disaggregate the data into region specific estimates, a clearer pattern emerges. Corruption is more harmful for female-run firms in the areas of the world that have more gender inequality overall."
  with: "with <a href='https://sites.google.com/site/jlbologna/'>Jamie Bologna Pavlik</a>"
  date: 2024-10-05
  year: 2025
  journal: "<em>Review of Development Economics</em>"
  pdf: "../files/research/bastos-pavlik-2025-corruption-harmful-women.pdf"
  pubclosed: "https://onlinelibrary.wiley.com/doi/10.1111/rode.13146"
  ssrn: "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=4387655"
  #appendix: "../files/research/gender_performance_appendix.pdf"

- title: "<b>[3] Female Ownership of Firms and Regulation Experience</b>"
  type: "Published"
  abstract: "The presence of gender disparity in de jure rules across the world is relatively well-known. Many studies show that this disparity is detrimental to female labor participation. Our focus is different in that we examine whether female-owned firms experience elevated time costs and burdens associated with government regulations relative to their male-owned counterparts. In this sense, we are interested in both de facto and de jure differences in governmental regulation. Using firm-level data and two alternative matching methods, our results suggest that firms with at least one female owner report that senior management spends a larger percentage of their time dealing with regulations. We also find that construction permits take approximately 4-7 days longer to obtain for these same firms. Lastly, we find that female-owned firms perceive labor regulations to be a larger obstacle to business operations. In all cases, these effects tend to be largest in countries with the most disparity in de jure rules. However, the gap remains even in the most de jure equal countries."
  with: "with <a href='https://sites.google.com/site/jlbologna/'>Jamie Bologna Pavlik</a>"
  date: 2024-10-03
  year: 2024
  journal: "<em>Journal of Development Studies</em>"
