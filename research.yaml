- title: "<b>Regulation and Firms: Evidence from Brazil</b>"
  type: "Under Review"
  abstract: "This paper examines how local regulatory reform shapes firm dynamics in a large developing economy. We study Brazil’s Lei da Liberdade Econômica (LLE, Economic Freedom Law), a 2019 federal reform that authorized municipalities to exempt “low-risk” businesses from licensing requirements. We leverage the staggered adoption by municipalities as a unique setting to evaluate how changes in the regulatory environment influence local economic activity. Using an entropy-balanced stacked difference-in-differences framework, we find that LLE adoption increased firm openings and economic activity. The evidence is consistent with the creation of new economic activity rather than pure reallocation or formalization, though both are contributing factors. We further exploit administrative records covering the universe of applications to open a firm (approximately 4.8 million records), finding that reduced time costs is a key mechanism behind the main results."
  date: 2026-06-12
  with: "with <a href='https://www.linkedin.com/in/rafaeldalmolin/'>Rafael Dal Molin</a> and <a href='https://sites.google.com/site/jlbologna/'>Jamie Bologna Pavlik</a>."
  pdf: "../files/research/dal-molin-pavlik-bastos-2026-LLE.pdf"
  ssrn: "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=6959105"

- title: "<b>Counter-Corruption Constitutional Provisions</b>"
  type: "Under Review"
  abstract: "Many countries have attempted to fight corruption by writing an anti-corruption commission directly into their constitution, yet there is little systematic evidence on whether this is effective. We study eighteen cases in which a country adopted, or substantially redesigned, a constitutionally backed counter-corruption commission, either through amendment of an existing constitution or as part of a new one. Using the Synthetic Control Method within an event-time framework, we compare each adopting country to a weighted combination of countries that similarly underwent constitutional change without adopting such a commission. We find little evidence that constitutional counter-corruption commissions systematically reduce corruption. Most estimated effects on V-Dem’s Political Corruption Index are statistically insignificant, and the few significant effects are modest, sensitive to the choice of donor pool, and point in opposing directions. Effects on investment per capita are similarly mixed. These conclusions hold across alternative donor pools, predictor sets, donor selection based on constitutional characteristics, and a pooled average treatment effect. Constitutional entrenchment alone does not appear to make anti-corruption commissions more effective."
  date: 2026-11-11
  with: "with <a href='https://www.justincallais.com'>Justin T. Callais</a> and <a href='https://sites.google.com/site/jlbologna/'>Jamie Bologna Pavlik</a>"
  pdf: "../files/research/callais-pavlik-bastos-2026-cccp.pdf"

######## WORKING PAPERS
- title: "<b>The Private Gains from Political Office: Evidence from Close Mayoral Elections in Brazil</b> | Job Market Paper"
  type: "Working"
  abstract: "Conventional wisdom suggests that the returns from politics are substantial, but empirical evidence tends to center on highly influential politicians in developed countries. I study whether low-level politicians obtain private returns from political office in the context of a developing country, using data on disclosures of wealth for Brazilian mayors and a regression discontinuity design around close election races. While I find only modest evidence of private returns from political office for the average mayor, I find substantial returns for mayors (relative to runner-ups) in municipalities with low institutional quality (7.5 to 10.5 p.p. a year) and without the presence of a local radio news station (6 to 8 p.p. a year). In contrast, municipalities with local oversight councils and high financial and managerial capacity, as well as those with local media presence, are effective in curbing political enrichment, leading to normal, or even negative, returns relative to runner-ups."
  date: 2026-01-01
  pdf: "../files/research/Job Market Paper - JP Bastos.pdf"
  with: "Recipient of <a href='https://www.publicchoicesociety.org/the-elinor-vincent-ostrom-prize/'>Public Choice Society's Elinor & Vincent Ostrom Prize</a> for Best Paper by a Graduate Student (2026)"

- title: "<b>Does Fighting Corruption Reduce the Private Gains from Political Office? Evidence from Brazilian Mayoral Elections</b>"
  type: "Working"
  abstract: "This paper studies how an exogenous reduction in corruption promoted by a randomized audit program of Brazilian municipalities affects the gains from political office. Among mayors running for reelection, I compare those that have been audited during their first term to those that did not. I find evidence that audited mayors’ reported wealth tended to be higher than that of non-audited mayors following the audit. Did a corruption crackdown make them richer? Most likely yes, but for two reasons that may be seen as perhaps unintended consequences of the audit. Municipal GDP grows faster in audited municipalities, explaining as much as 94% of the change in mayors’ wealth; moreover, I find suggestive evidence that mayors are induced to disclose previously-omitted assets, increasing transparency in the electoral process."
  date: 2024-11-01
  pdf: "../files/research/bastos-2025-corruption-private-gains-brazil.pdf"

