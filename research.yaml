- title: "<b>[12] The Forsaken Road: Reassessing Living Standards following the Cuban Revolution and the American Embargo</b> "
  type: "Published"
  pubopen: "https://doi.org/10.1016/j.jdeveco.2026.103831"
  ssrn: "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=5235912"
  pdf: "../files/research/bastos-geloso-pavlik-forsaken-road.pdf"
  replication: "https://github.com/jpmvbastos/jpmvbastos.github.io/raw/main/files/research/cuba-replication.zip"
  github: "https://github.com/jpmvbastos/cuba-forsaken-road/tree/main"
  blog: "https://thedailyeconomy.org/article/socialism-not-the-embargo-explains-nearly-all-of-cubas-poverty/"
  date: 2026-05-19
  year: "2026"
  journal: "<em>Journal of Development Economics</em>"
  with: "with <a href='https://vincentgeloso.com'>Vincent Geloso</a> and <a href='https://sites.google.com/site/jlbologna/'>Jamie Bologna Pavlik</a>"
  abstract: "We investigate the causal effects of the 1959 Cuban Revolution on income using a synthetic control approach. We employ a novel dataset with revised GDP estimates that do not rely on the regime’s self-reported statistics. We also analyze GDP estimates net of aid coming from the Soviet Union. Our identification strategy allows us to separate the direct effects of the revolution from the diplomatic events that ensued. By overcoming concerns that Cuban GDP statistics are inflated either by the regime’s direct manipulation or by Soviet aid, we identify a large decline in Cuban GDP per capita relative to its counterfactual. The decline is larger when accounting for Soviet aid. The embargo only accounts for a minor share of Cuba’s under-performance relative to the counterfactual. Our results hold after being subjected to multiple robustness checks and lead to the conclusion that the transition to socialism was the main driver of the inferior economic path Cuba has followed since 1959."
  note: "Featured in: <em><a href='https://exame.com/colunistas/instituto-millenium/o-que-a-revolucao-cubana-nos-ensina-sobre-a-prosperidade-economica/'>Exame</a>, <a href='https://www.youtube.com/watch?v=YkYJ0q9RsM8'>VisualEconomik</a></em>. \n Spanish version <a href='../files/research/bastos-geloso-pavlik-forsaken-road.pdf'>here.</a>"

- title: "<b>[11] Corruption and the Allocation of Business Activity in Brazil</b>"
  type: "Published"
  abstract: "It is well known that corruption is harmful to the economy, reducing investment and entrepreneurial activity. Corruption’s effect on the allocation of economic activity, however, is comparatively understudied. We examine the relationship between corruption and sector allocation in Brazilian municipalities. More specifically, we test whether the allocations of employees and establishments across sectors are influenced by the amount of corruption in the area. We also test whether sectors are more concentrated in general using an employment share weighted HHI measure. We find that there are larger shares of employment and establishments in the relatively non-corrupt agricultural sector in highly corrupt areas and, likewise, lower shares of employment/establishments in sectors that are relatively corruption-prone (e.g., construction). This result implies that individuals are trying to avoid the problem of corruption by participating in sectors that are less vulnerable. We also find that public administration employment and establishment shares are higher in more corrupt areas, suggesting bureaucratic bloat. Our strongest evidence of the impact of corruption is shown through concentration, where concentration is higher (implying less competition) in more corrupt municipalities across every sector."
  date: 2026-05-15
  journal: "<em>Public Finance Review</em>"
  pubclosed: "https://journals.sagepub.com/doi/abs/10.1177/10911421261456494"
  pdf: "../files/research/bastos-callais-pavlik-2025-corruption-entrepreneur-brazil.pdf"
  with: "with <a href='https://www.justincallais.com'>Justin T. Callais</a> and <a href='https://sites.google.com/site/jlbologna/'>Jamie Bologna Pavlik</a>"
  year: "2026"
  
- title: "<b>[10] Do Rights of Nature Protect the Environment? Macro-Level Evidence from Ecuador</b>"
  type: "Published"
  abstract: "Left-leaning populist regimes, such as Rafael Correa’s government in Ecuador (2007–2016), often claim to protect the environment from the negative effects of free-market regimes. This study examines the environmental impact in Ecuador following the 2008 Constitution, which was the first in the world to include rights of nature. We find no statistical evidence that Correa’s constitutional change had any measurable effect on Ecuador’s macro-level environmental outcomes, as captured by forest cover, greenhouse gas emissions, renewable energy output, and carbon intensity of GDP."
  pdf: "../files/research/bastos-cachanosky-callais-2026-rights-of-nature.pdf"
  pubopen: "https://link.springer.com/article/10.1007/s10602-026-09514-6"
  ssrn: "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=5531461"
