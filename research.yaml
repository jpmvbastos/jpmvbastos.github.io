- title: "<b>Leader's Ideology and Economic Freedom</b>"
  type: "Under Review"
  abstract: "We revisit the proposition that right-wing governments tend to promote free markets while left-wing governments constrain them, providing the first causal estimates of the effect of government leaders’ ideology on economic freedom. Using a doubly-robust stacked difference-in-differences approach that accounts for staggered treatment timing, we identify clean ideological transitions following a stable pre-treatment period in a sample of 153 countries between 2000 and 2023 using Economic Freedom of the World (EFW) as the main outcome, and for a sample of 21 OECD countries extending as far back as 1870 using the Historical Index of Economic Liberty (HIEL). For the Global-EFW sample, we find no significant effects following transitions to either a left or a right-wing government. For the OECD sample, we find no evidence that a transition to a right-wing government affects economic freedom. Our two most robust findings are a negative, but small, effect on economic freedom following a transition to a left government among OECD countries, driven by a larger size of government, and a small, positive, and significant impact on economic freedom following a transition to the right among non-OECD countries."
  date: 2026-09-01
  with: "with <a href='https://leoregalado.com'>Leonel Regalado</a> and <a href='https://www.benjaminwpowell.com'>Benjamin Powell</a>"
  journal: "Revise and resubmit, <em>Economics and Politics</em>."
  pdf: "../files/research/regalado-bastos-powell-ideology-economic-freedom.pdf"
